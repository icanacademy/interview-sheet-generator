<!DOCTYPE html>
<html>
<head>
    <title>Data Diagnostic</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .data { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Interview Data Diagnostic</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        // Check localStorage
        const interviewData = localStorage.getItem('interviewData');

        if (!interviewData) {
            results.innerHTML += '<div class="error">❌ No interview data found in localStorage</div>';
        } else {
            const data = JSON.parse(interviewData);
            results.innerHTML += `<div class="success">✅ Found ${data.length} saved interviews</div>`;

            // Show each entry
            data.forEach((entry, index) => {
                results.innerHTML += `
                    <div class="data">
                        <strong>Entry ${index + 1}:</strong><br>
                        Student: ${entry.studentName}<br>
                        Type: ${entry.type}<br>
                        Date: ${entry.date}<br>
                        Timestamp: ${entry.timestamp}<br>
                        Has Scores: ${Object.keys(entry.scores || {}).length > 0 ? 'Yes' : 'No'}<br>
                        Has Persuasion: ${Object.keys(entry.persuasion || {}).length > 0 ? 'Yes' : 'No'}<br>
                        Has Reports: ${Object.keys(entry.reports || {}).length > 0 ? 'Yes' : 'No'}
                    </div>
                `;
            });

            // Show raw data
            results.innerHTML += '<h2>Raw Data (copy this as backup):</h2>';
            results.innerHTML += `<textarea style="width: 100%; height: 200px;">${interviewData}</textarea>`;
        }
    </script>
</body>
</html>
